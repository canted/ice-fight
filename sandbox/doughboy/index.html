<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Doughboy · Ice Fight playground</title><link rel="stylesheet" href="/style.css"></head><body><header><a href="http://localhost:3003/">Ice Fight</a><span>Local physics playground</span></header><main><section class="stage"><div class="intro"><h1>A little out of shape.</h1><p>Fold the fighter. Slide each skate.</p></div><canvas aria-label="Draggable red hockey fighter physics playground. Drag the head, belly or arms. Drag each skate along the floor; lower legs tilt up to20 degrees."></canvas><div class="stage-note"><span class="dot"></span><span id="status" aria-live="polite">Grab and drag</span><button id="punch-light">Light punch</button><button id="punch-medium">Medium punch</button><button id="punch-strong">Strong punch</button></div></section><aside><h2>Doughboy</h2><p class="lede">The red corner. A little worse for wear.</p><label for="softness">Softness <output id="softness-value">60%</output></label><input id="softness" type="range" min="0" max="1" step=".01" value=".6"><div class="ends"><span>Firm</span><span>Gelatinous</span></div><label for="damping">Damping <output id="damping-value">85%</output></label><input id="damping" type="range" min="0" max="1" step=".01" value=".85"><div class="ends"><span>Wobbly</span><span>Settled</span></div><label for="iceFriction">Ice friction <output id="iceFriction-value">10%</output></label><input id="iceFriction" type="range" min="0" max="1" step=".01" value="0.1"><label for="feetEffort">Feet effort <output id="feetEffort-value">60%</output></label><input id="feetEffort" type="range" min="0" max="1" step=".01" value="0.6"><label for="headEffort">Head effort <output id="headEffort-value">60%</output></label><input id="headEffort" type="range" min="0" max="1" step=".01" value="0.6"><button id="reset">Reset pose <span>R</span></button><label class="check"><input id="skeleton" type="checkbox"> Show the joints</label></aside></main><script type="module" src="/app.mjs"></script></body></html>
